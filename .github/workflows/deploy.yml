name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via the official deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Requires Pages to already be switched on for the repository, with the
      # source set to GitHub Actions (see README). The `enablement: true` option
      # cannot cover this: creating a Pages site is an admin-scoped API call, and
      # the workflow's GITHUB_TOKEN only reaches `pages: write`.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # The repository root is the site: plain static files, no build step.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
